defaults:
  - system: cartpole
  - model: mlp_small
  - device: gpu0
  - _self_

seed: 42
name: default

# --- Data (populated by system config) ---
data:
  _target_: ${system.data_target}
  dataset_dir: ${system.dataset_dir}
  split_index: 0
  num_trajectories: 1000
  train_split: 0.95
  batch_size: 256
  num_workers: 4
  balance_samples: true

# --- Model ---
# hidden_layers comes from model group defaults
model:
  _target_: roa_classification.model.mlp.ClassifierMLP
  input_dim: ${system.input_dim}
  lr: 1e-3
  weight_decay: 1e-4
  T_max: ${trainer.max_epochs}
  eta_min: 1e-6
  lower_thresh: 0.4
  upper_thresh: 0.6

# --- Trainer ---
trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 500
  accelerator: ${device.accelerator}
  devices: ${device.devices}
  log_every_n_steps: 10

# --- Callbacks ---
callbacks:
  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${hydra:runtime.output_dir}/checkpoints
    monitor: val/loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "epoch{epoch:02d}-val_loss{val_loss:.4f}"
    auto_insert_metric_name: false
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/loss
    patience: 50
    mode: min

# --- Logger ---
logger:
  _target_: lightning.pytorch.loggers.TensorBoardLogger
  save_dir: ${hydra:runtime.output_dir}
  name: ""

hydra:
  run:
    dir: outputs/${name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    name: train_${system.name}
