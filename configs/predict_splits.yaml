defaults:
  - system: cartpole
  - device: gpu0
  - _self_

seed: 42
checkpoint: ???   # Must be provided: checkpoint=/path/to/model.ckpt
output_dir: ???   # Must be provided: output_dir=/path/to/save/csvs

data:
  _target_: ${system.data_target}
  dataset_dir: ${system.dataset_dir}
  split_index: 0
  split_name: null
  num_trajectories: 1000
  train_split: 0.9
  test_file: test_set.txt
  batch_size: 256
  num_workers: 4
  balance_samples: false

hydra:
  run:
    dir: outputs/predict_splits/${system.name}/${now:%Y-%m-%d_%H-%M-%S}
